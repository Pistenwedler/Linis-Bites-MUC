name: update
on:
  schedule: [{cron: "17 6 */2 * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scrape.py
      - run: python rossmann.py
        continue-on-error: true
      - run: pip install playwright && playwright install --with-deps chromium && python dm_probe.py
        continue-on-error: true
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add docs; git commit -m "update" || echo "keine Änderung"; git push
