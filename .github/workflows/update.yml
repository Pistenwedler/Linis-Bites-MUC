name: update
on:
  schedule: [{cron: "7 * * * *"}]
  workflow_dispatch:
    inputs:
      test_push: {description: "Test-Push senden", type: boolean, default: false}
permissions: {contents: write}
concurrency: {group: update, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scrape.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          NTFY_TEST: ${{ inputs.test_push }}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add docs; git commit -m "update" || echo "keine Änderung"
          git pull --rebase; git push
